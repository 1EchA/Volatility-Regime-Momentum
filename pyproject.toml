[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-regime-momentum"
version = "1.0.0"
description = "A股量化策略研究平台：基于波动率制度的条件动量效应分析"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "1EchA", email = "pingtianhechuan@gmail.com"},
]
maintainers = [
    {name = "1EchA", email = "pingtianhechuan@gmail.com"},
]
keywords = [
    "quantitative finance",
    "momentum trading",
    "volatility regime",
    "chinese stock market",
    "streamlit",
    "factor investing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    # Core Data Processing
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    # Web Interface
    "streamlit>=1.28.0,<2.0.0",
    "plotly>=5.15.0,<6.0.0",
    "streamlit-plotly-events>=0.0.6",
    # Machine Learning & Statistics
    "scikit-learn>=1.3.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    # Data Visualization
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    # Data Sources
    "akshare>=1.14.0,<2.0.0",
    "yfinance>=0.2.0,<1.0.0",
    # Utilities
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
    # Performance
    "numba>=0.58.0,<1.0.0",
    "joblib>=1.3.0,<2.0.0",
    # Configuration
    "pydantic>=2.5.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    # Progress & Logging
    "tqdm>=4.65.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=23.7.0,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "flake8>=6.0.0,<7.0.0",
    "mypy>=1.5.0,<2.0.0",
]
docs = [
    "sphinx>=7.1.0,<8.0.0",
    "sphinx-rtd-theme>=1.3.0,<2.0.0",
    "myst-parser>=2.0.0,<3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/1EchA/Volatility-Regime-Momentum"
"Bug Reports" = "https://github.com/1EchA/Volatility-Regime-Momentum/issues"
"Source" = "https://github.com/1EchA/Volatility-Regime-Momentum"

# CLI entrypoint disabled - streamlit_app.py has no main() function
# To enable, add def main(): ... to app/streamlit_app.py
# [project.scripts]
# vrm = "app.streamlit_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "analysis*", "scripts*"]
exclude = ["data*", "logs*", ".venv*", "tests*", "docs*", "cache*"]

[tool.setuptools]
py-modules = [
    "run_full_pipeline",
    "data_collector",
    "data_collector_50stocks",
    "simple_factor_calculator",
    "volatility_regime_analyzer",
    "predictive_model",
    "fama_macbeth_analyzer",
    "conditional_fama_macbeth_analyzer",
    "regime_difference_analyzer",
    "regime_factor_selector",
    "regime_model_grid_search",
    "regime_model_sensitivity",
    "factor_selector",
    "model_grid_search",
    "industry_classifier",
    "single_factor_ic_analyzer",
    "universe_selector",
]

[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app", "analysis", "tests"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E402", "E501"]
exclude = [".git", "__pycache__", ".venv", "build", "dist", "data"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["app", "analysis"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
